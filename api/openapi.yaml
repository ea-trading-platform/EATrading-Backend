openapi: 3.0.3
info:
  title: EA Trading Backend API
  description: REST API for authentication, client data, orders, holdings, and market data.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Development server

tags:
  - name: Auth
    description: Authentication and token lifecycle
  - name: Clients
    description: Client profile operations
  - name: Orders
    description: Order placement and lifecycle operations
  - name: Holdings
    description: Portfolio holdings operations
  - name: Portfolio
    description: Portfolio summary and historical valuation operations
  - name: Market Data
    description: Quotes, candles, and market utilities

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new client
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/health:
    get:
      tags: [Auth]
      summary: Auth service health check
      operationId: authHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: UP
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/clients:
    get:
      tags: [Clients]
      summary: Get client profile
      description: |
        Endpoint has two behaviors:
        - Without `clientId`: always returns `403` (bulk listing is blocked).
        - With `clientId`: returns that client profile if authorized.
      operationId: getClients
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client profile returned when clientId is provided and authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden when bulk listing is attempted or when resource access is unauthorized
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Clients]
      summary: Update client profile
      operationId: updateClient
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders:
    get:
      tags: [Orders]
      summary: Get orders by client ID
      operationId: getOrdersByClient
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderTransactionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Orders]
      summary: Create transaction order
      description: Uses the authenticated client from JWT and returns a trackingId.
      operationId: createTransactionOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransactionRequest'
      responses:
        '201':
          description: Order accepted for processing
          content:
            application/json:
              schema:
                type: string
                format: uuid
                description: trackingId
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders/{trackingId}:
    patch:
      tags: [Orders]
      summary: Cancel submitted order
      operationId: cancelOrder
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{trackingId}/status-log:
    get:
      tags: [Orders]
      summary: Get an order's status history
      operationId: getOrderStatusLog
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status history, including any rejection reason
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/OrderStatusLogResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/holdings:
    get:
      tags: [Holdings]
      summary: Get holdings by client ID
      operationId: getClientHoldings
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Holdings retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/portfolio:
    get:
      tags: [Portfolio]
      summary: Get current portfolio summary
      operationId: getPortfolioSummary
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current portfolio summary in USD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/portfolio/history:
    get:
      tags: [Portfolio]
      summary: Get historical portfolio snapshots
      operationId: getPortfolioHistory
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historical portfolio snapshots in USD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/market/quotes/{symbol}:
    get:
      tags: [Market Data]
      summary: Get quote by symbol
      operationId: getQuote
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quote data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/market/spread/{symbol}:
    get:
      tags: [Market Data]
      summary: Get bid ask spread by symbol
      operationId: getSpread
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Spread metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpreadResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/market/changes/{symbol}:
    get:
      tags: [Market Data]
      summary: Get change metrics by symbol
      operationId: getChangeMetrics
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Change metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeMetricsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/market/candles/{symbol}:
    get:
      tags: [Market Data]
      summary: Get historical candles by symbol
      operationId: getCandles
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OHLCV candle data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/market/price/{symbol}:
    get:
      tags: [Market Data]
      summary: Get current price by symbol
      description: Note that symbol is returned as a numeric hash in the current implementation.
      operationId: getCurrentPrice
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current price payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPriceResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/market/health:
    get:
      tags: [Market Data]
      summary: Market provider health check
      operationId: marketHealth
      security: []
      responses:
        '200':
          description: Health status string
          content:
            text/plain:
              schema:
                type: string
                example: UP
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, confirmPassword]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        clientId:
          type: string
          format: uuid
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
          example: Bearer

    ClientResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClientUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    OrderTransactionRequest:
      type: object
      required: [clientId, symbol, name, transactionType, quantity, instrument]
      properties:
        trackingId:
          type: string
          format: uuid
          description: Auto-generated if omitted.
        clientId:
          type: string
          format: uuid
          description: Overwritten by authenticated client ID in controller.
        symbol:
          type: string
        name:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
        transactionType:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true

    OrderTransactionResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        trackingId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        symbol:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
        transactionType:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: string
        price:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        orderDate:
          type: string
          format: date-time
        rejectionReason:
          type: string
          nullable: true

    OrderStatus:
      type: string
      enum: [SUBMITTED, CANCELED, REJECTED, ACCEPTED, FILLED]
    OrderStatusLogResponse:
      type: object
      properties:
        statusChangeTime:
          type: string
          format: date-time
        rejectionReason:
          type: string
          nullable: true

    Asset:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'

    Instrument:
      type: string
      enum: [CASH, EQUITY, CRYPTO]

    CancelOrderResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Order canceled successfully
        trackingId:
          type: string
          format: uuid
        currentStatus:
          type: string
          example: CANCELED

    HoldingResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        symbol:
          type: string
        name:
          type: string
          nullable: true
        instrument:
          $ref: '#/components/schemas/Instrument'
        quantity:
          type: string
        avgBuyPrice:
          type: string
        currentPrice:
          type: string
        dailyChange:
          type: string
        dailyChangePercent:
          type: string
        unrealizedReturn:
          type: string
        unrealizedReturnPercent:
          type: string
        currentValue:
          type: string
          nullable: true

    PortfolioSummaryResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        availableCashUsd:
          type: string
        portfolioValueUsd:
          type: string
        investedValueUsd:
          type: string
        overallReturnUsd:
          type: string
        overallReturnPercent:
          type: string
        dailyChangeUsd:
          type: string
        dailyChangePercent:
          type: string
        asOf:
          type: string
          format: date-time

    PortfolioHistoryResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        interval:
          type: string
          example: 1d
        points:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioHistoryPointResponse'

    PortfolioHistoryPointResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        portfolioValueUsd:
          type: string
        cashValueUsd:
          type: string
        investedValueUsd:
          type: string
        dailyChangeUsd:
          type: string

    Quote:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
          format: double
        bid:
          type: number
          format: double
        ask:
          type: number
          format: double
        spreadBps:
          type: number
          format: double
        currency:
          type: string
        change:
          type: number
          format: double
          nullable: true
        changePercent:
          type: number
          format: double
          nullable: true
        previousClose:
          type: number
          format: double
          nullable: true
        asOf:
          type: string
        marketState:
          type: string

    SpreadResponse:
      type: object
      properties:
        bid:
          type: number
          format: double
        ask:
          type: number
          format: double
        spreadBps:
          type: number
          format: double

    ChangeMetricsResponse:
      type: object
      properties:
        change:
          type: number
          format: double
        changePercent:
          type: number
          format: double

    CurrentPriceResponse:
      type: object
      properties:
        symbol:
          type: number
          format: double
          description: Numeric hash of symbol string from current implementation.
        price:
          type: number
          format: double

    Candle:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        adjclose:
          type: number
          format: double
        volume:
          type: integer
          format: int64
        synthetic:
          type: boolean

    CandleData:
      type: object
      properties:
        symbol:
          type: string
        interval:
          type: string
        currency:
          type: string
        candles:
          type: array
          items:
            $ref: '#/components/schemas/Candle'

    CandleMetadata:
      type: object
      properties:
        asOf:
          type: string
        disclaimer:
          type: string
        symbol:
          type: string
        source:
          type: string
        stale:
          type: boolean
        partial:
          type: boolean
        availableFrom:
          type: string

    CandlesResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CandleData'
        meta:
          $ref: '#/components/schemas/CandleMetadata'

    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            fieldErrors:
              type: object
              additionalProperties:
                type: string

  responses:
    BadRequestError:
      description: Bad request or validation error
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/ValidationError'

    UnauthorizedError:
      description: Missing or invalid authentication credentials

    ForbiddenError:
      description: Authenticated user is not allowed to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    UnprocessableEntityError:
      description: Request is syntactically valid but fails business rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
