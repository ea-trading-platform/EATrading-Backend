spring.config.activate.on-profile=aws

# AWS PostgreSQL Database Configuration
spring.datasource.url=${AWS_DB_URL:jdbc:postgresql://eatrading-db.livefree.click:5432/eatrading-db?sslmode=require}
spring.datasource.username=${AWS_DB_USER:dbmasteruser}
spring.datasource.password=${AWS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect