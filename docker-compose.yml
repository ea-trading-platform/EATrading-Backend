services:
  postgres:
    image: postgres:18
    container_name: postgres-ea-trading
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8088:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ea-trading-network
    restart: on-failure

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ea-trading-api
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JPA_DDL_AUTO: update
      SPRINGBOOT_PORT: ${SPRINGBOOT_PORT}
      FAUXNANCE_API_URL: ${FAUXNANCE_API_URL}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
    ports:
      - "${SPRINGBOOT_PORT}:${SPRINGBOOT_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ea-trading-network
    restart: on-failure

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_PORT},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_IP}:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"

    networks:
      - ea-trading-network

    restart: on-failure

volumes:
  postgres_data:
    driver: local

networks:
  ea-trading-network:
    driver: bridge